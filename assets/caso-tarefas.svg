<svg xmlns="http://www.w3.org/2000/svg" width="280" height="350" viewBox="0 0 280 350">
  <!-- ARQUIVO H.M. — CASO 02: Lista de tarefas -->
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .centro { transform-box: fill-box; transform-origin: center; }
    /* cada item: o check se desenha e o texto é riscado, um depois do outro */
    .ck0, .rs0 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ck0 8s infinite; }
    @keyframes ck0 { 0%, 10% { stroke-dashoffset: 1; } 16%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; } }
    .tx0 { animation: tx0 8s infinite; }
    @keyframes tx0 { 0%, 10% { fill: #2b2418; } 16%, 92% { fill: #9a917f; } 100% { fill: #2b2418; } }
    .ck1, .rs1 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ck1 8s infinite; }
    @keyframes ck1 { 0%, 30% { stroke-dashoffset: 1; } 36%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; } }
    .tx1 { animation: tx1 8s infinite; }
    @keyframes tx1 { 0%, 30% { fill: #2b2418; } 36%, 92% { fill: #9a917f; } 100% { fill: #2b2418; } }
    .ck2, .rs2 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ck2 8s infinite; }
    @keyframes ck2 { 0%, 50% { stroke-dashoffset: 1; } 56%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; } }
    .tx2 { animation: tx2 8s infinite; }
    @keyframes tx2 { 0%, 50% { fill: #2b2418; } 56%, 92% { fill: #9a917f; } 100% { fill: #2b2418; } }
    /* carimbo batendo uma vez a cada ciclo de 8s */
    .carimbo { animation: carimbo 8s infinite; }
    @keyframes carimbo {
      0%, 8% { opacity: 0; transform: rotate(-12deg) scale(1.8); }
      11% { opacity: .9; transform: rotate(-12deg) scale(.95); }
      13%, 100% { opacity: .9; transform: rotate(-12deg) scale(1); }
    }
    .seta { animation: seta 1.6s ease-in-out infinite; }
    @keyframes seta { 50% { transform: translateX(5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- pasta do caso -->
  <rect width="280" height="350" rx="10" fill="#17191c"/>
  <rect x=".5" y=".5" width="279" height="349" rx="10" fill="none" stroke="#2f3338"/>
  <text x="20" y="27" font-size="11" font-weight="700" fill="#b3261e" letter-spacing="2">ARQUIVO H.M. · CASO 02</text>

  <!-- foto da cena -->
  <g filter="url(#sombra)"><rect x="20" y="40" width="240" height="170" fill="#ece6d8"/></g>
  <!-- bloco de notas -->
  <g transform="rotate(3 140 125)">
    <rect x="52" y="50" width="176" height="152" fill="#fbf7ec" stroke="#cfc6b3"/>
    <line x1="52" y1="74" x2="228" y2="74" stroke="#c0281f" stroke-width="1"/>
    <text x="62" y="68" font-size="13" font-weight="700" fill="#2b2418">TAREFAS</text>
    <rect x="64" y="88" width="15" height="15" rx="2" fill="none" stroke="#2b2418" stroke-width="1.6"/>
    <path class="ck0" pathLength="1" d="M66,95 L71,100 L82,85" fill="none" stroke="#2f8f4e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="tx0" x="88" y="100" font-size="13">estudar o DOM</text>
    <line class="rs0" pathLength="1" x1="86" y1="96" x2="189" y2="96" stroke="#b3261e" stroke-width="1.6"/>
    <rect x="64" y="122" width="15" height="15" rx="2" fill="none" stroke="#2b2418" stroke-width="1.6"/>
    <path class="ck1" pathLength="1" d="M66,129 L71,134 L82,119" fill="none" stroke="#2f8f4e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="tx1" x="88" y="134" font-size="13">fazer commit</text>
    <line class="rs1" pathLength="1" x1="86" y1="130" x2="182" y2="130" stroke="#b3261e" stroke-width="1.6"/>
    <rect x="64" y="156" width="15" height="15" rx="2" fill="none" stroke="#2b2418" stroke-width="1.6"/>
    <path class="ck2" pathLength="1" d="M66,163 L71,168 L82,153" fill="none" stroke="#2f8f4e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="tx2" x="88" y="168" font-size="13">achar o bug</text>
    <line class="rs2" pathLength="1" x1="86" y1="164" x2="174" y2="164" stroke="#b3261e" stroke-width="1.6"/>
  </g>

  <!-- carimbo -->
  <g class="carimbo centro">
    <rect x="144" y="172" width="118" height="28" rx="3" fill="#17191c" fill-opacity=".6" stroke="#d0443a" stroke-width="2.5"/>
    <text x="203" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#d0443a" letter-spacing="1">ENCERRADO</text>
  </g>

  <!-- ficha -->
  <text x="20" y="240" font-size="17" font-weight="700" fill="#efe7d4">Lista de tarefas</text>
  <text x="20" y="262" font-size="11.5" fill="#a9a399">Adicionar, concluir e remover</text><text x="20" y="278" font-size="11.5" fill="#a9a399">tarefas, praticando DOM e eventos.</text>
  <rect x="20" y="302" width="43" height="20" rx="3" fill="none" stroke="#5b5f66"/><text x="27" y="316" font-size="11" fill="#d8d2c4">HTML</text><rect x="68.8" y="302" width="36" height="20" rx="3" fill="none" stroke="#5b5f66"/><text x="75.8" y="316" font-size="11" fill="#d8d2c4">CSS</text><rect x="110.4" y="302" width="86" height="20" rx="3" fill="none" stroke="#5b5f66"/><text x="117.4" y="316" font-size="11" fill="#d8d2c4">JavaScript</text>
  <text x="20" y="340" font-size="11" fill="#7d8188">clique para abrir o caso</text>
  <text class="seta" x="250" y="340" font-size="12" fill="#b3261e">→</text>
</svg>
