<svg xmlns="http://www.w3.org/2000/svg" width="280" height="350" viewBox="0 0 280 350">
  <!-- ARQUIVO H.M. — CASO 05: Analisador de avaliações com IA -->
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <clipPath id="painel"><rect x="58" y="56" width="164" height="136" rx="4"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .centro { transform-box: fill-box; transform-origin: center; }
    /* barras do dashboard crescendo, uma depois da outra */
    .barra { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
    .b1 { animation: b1 8s ease-out infinite; }
    @keyframes b1 { 0%, 4% { transform: scaleX(0); } 14%, 100% { transform: scaleX(1); } }
    .b2 { animation: b2 8s ease-out infinite; }
    @keyframes b2 { 0%, 8% { transform: scaleX(0); } 18%, 100% { transform: scaleX(1); } }
    .b3 { animation: b3 8s ease-out infinite; }
    @keyframes b3 { 0%, 12% { transform: scaleX(0); } 22%, 100% { transform: scaleX(1); } }
    .b4 { animation: b4 8s ease-out infinite; }
    @keyframes b4 { 0%, 16% { transform: scaleX(0); } 26%, 100% { transform: scaleX(1); } }
    .b5 { animation: b5 8s ease-out infinite; }
    @keyframes b5 { 0%, 20% { transform: scaleX(0); } 30%, 100% { transform: scaleX(1); } }
    /* linha de varredura da IA passando pelo painel */
    .varredura { animation: varredura 8s linear infinite; }
    @keyframes varredura { 0% { transform: translateY(0); opacity: 0; } 3% { opacity: .9; } 30% { transform: translateY(128px); opacity: .9; } 33%, 100% { transform: translateY(128px); opacity: 0; } }
    /* contador de avaliações */
    .n0 { opacity: 1; animation: n0 8s steps(1) infinite; }
    @keyframes n0 { 0% { opacity: 1; } 10% { opacity: 0; } }
    .n1 { opacity: 0; animation: n1 8s steps(1) infinite; }
    @keyframes n1 { 10% { opacity: 1; } 20% { opacity: 0; } }
    .n2 { opacity: 0; animation: n2 8s steps(1) infinite; }
    @keyframes n2 { 20% { opacity: 1; } 30% { opacity: 0; } }
    .n3 { opacity: 0; animation: n3 8s steps(1) infinite; }
    @keyframes n3 { 30% { opacity: 1; } 100% { opacity: 0; } }
    /* carimbo batendo uma vez a cada ciclo de 8s */
    .carimbo { animation: carimbo 8s infinite; }
    @keyframes carimbo {
      0%, 34% { opacity: 0; transform: rotate(-12deg) scale(1.8); }
      37% { opacity: .9; transform: rotate(-12deg) scale(.95); }
      39%, 100% { opacity: .9; transform: rotate(-12deg) scale(1); }
    }
    .seta { animation: seta 1.6s ease-in-out infinite; }
    @keyframes seta { 50% { transform: translateX(5px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .barra { transform: scaleX(1); }
      .n0 { opacity: 0; } .n3 { opacity: 1; }
    }
  </style>

  <!-- pasta do caso -->
  <rect width="280" height="350" rx="10" fill="#17191c"/>
  <rect x=".5" y=".5" width="279" height="349" rx="10" fill="none" stroke="#2f3338"/>
  <text x="20" y="27" font-size="11" font-weight="700" fill="#b3261e" letter-spacing="2">ARQUIVO H.M. · CASO 05</text>

  <!-- foto da cena -->
  <g filter="url(#sombra)"><rect x="20" y="40" width="240" height="170" fill="#ece6d8"/></g>

  <!-- dashboard desenhado -->
  <g transform="rotate(-3 140 124)">
    <rect x="58" y="56" width="164" height="136" rx="4" fill="#24272b" stroke="#0e0f11" stroke-width="2"/>
    <text x="68" y="72" font-size="8" font-weight="700" fill="#d0443a" letter-spacing="1">AVALIAÇÕES · IA</text>
    <!-- cartão com o contador -->
    <rect x="164" y="62" width="50" height="20" rx="2" fill="none" stroke="#5b5f66"/>
    <g font-size="11" font-weight="700" fill="#efe7d4" text-anchor="middle">
      <text class="n0" x="189" y="76">0</text><text class="n1" x="189" y="76">57</text><text class="n2" x="189" y="76">143</text><text class="n3" x="189" y="76">200</text>
    </g>
    <!-- barras: elogio em verde, problemas em vermelho -->
    <g font-size="7" fill="#a9a399">
      <text x="68" y="99">elogio</text>
      <text x="68" y="117">não entregue</text>
      <text x="68" y="135">produto errado</text>
      <text x="68" y="153">qualidade</text>
      <text x="68" y="171">atraso</text>
    </g>
    <rect class="barra b1" x="68" y="102" width="140" height="6" rx="1" fill="#4caf50"/>
    <rect class="barra b2" x="68" y="120" width="89" height="6" rx="1" fill="#d0443a"/>
    <rect class="barra b3" x="68" y="138" width="55" height="6" rx="1" fill="#d0443a"/>
    <rect class="barra b4" x="68" y="156" width="35" height="6" rx="1" fill="#d0443a"/>
    <rect class="barra b5" x="68" y="174" width="26" height="6" rx="1" fill="#d0443a"/>
    <!-- varredura -->
    <g clip-path="url(#painel)">
      <rect class="varredura" x="58" y="58" width="164" height="2" fill="#e0a43a"/>
    </g>
  </g>

  <!-- carimbo -->
  <g class="carimbo centro">
    <rect x="144" y="172" width="118" height="28" rx="3" fill="#17191c" fill-opacity=".6" stroke="#d0443a" stroke-width="2.5"/>
    <text x="203" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#d0443a" letter-spacing="1">ENCERRADO</text>
  </g>

  <!-- ficha -->
  <text x="20" y="240" font-size="17" font-weight="700" fill="#efe7d4">Analisador com IA</text>
  <text x="20" y="262" font-size="11.5" fill="#a9a399">IA classifica 200 avaliações</text><text x="20" y="278" font-size="11.5" fill="#a9a399">e alimenta um dashboard.</text>
  <rect x="20" y="302" width="34" height="20" rx="3" fill="none" stroke="#5b5f66"/><text x="27" y="316" font-size="11" fill="#d8d2c4">n8n</text><rect x="59" y="302" width="54" height="20" rx="3" fill="none" stroke="#5b5f66"/><text x="66" y="316" font-size="11" fill="#d8d2c4">Gemini</text><rect x="118" y="302" width="86" height="20" rx="3" fill="none" stroke="#5b5f66"/><text x="125" y="316" font-size="11" fill="#d8d2c4">JavaScript</text>
  <text x="20" y="340" font-size="11" fill="#7d8188">clique para abrir o caso</text>
  <text class="seta" x="250" y="340" font-size="12" fill="#b3261e">→</text>
</svg>
