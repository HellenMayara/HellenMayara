<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
  <!--
    ARQUIVO H.M. — CRONOLOGIA DO CASO
    As fichas vão sendo pregadas no mural uma de cada vez e o fio vermelho
    liga cada pista à seguinte. Ciclo de 20s.
  -->
  <defs>
    <!-- textura de cortiça -->
    <filter id="cortica" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="11" result="r"/>
      <feColorMatrix in="r" values="0 0 0 0 .18  0 0 0 0 .1  0 0 0 0 .04  0 0 0 .55 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="g2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="g2"/></feMerge>
    </filter>
    <filter id="sombra" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <radialGradient id="luz" cx=".5" cy=".45" r=".75">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
  </defs>

  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .ficha { transform-box: fill-box; transform-origin: 50% 0; }

    /* Fio vermelho: o mesmo truque da caneta do dossiê (stroke-dashoffset de 1 até 0) */
    .fio { fill: none; stroke: #c0281f; stroke-width: 2.2; stroke-linecap: round;
            stroke-dasharray: 1; stroke-dashoffset: 1; }

    /* Cada ficha "cai" no mural e balança antes de parar */
    .f0 { animation: f0 20s infinite; }
    @keyframes f0 { 0%, 2.00% { opacity: 0; transform: translateY(-26px) rotate(-6deg); } 3.75% { opacity: 1; transform: translateY(3px) rotate(1deg); } 4.75%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
    .s0 { animation: s0 20s infinite; }
    @keyframes s0 { 0%, 3.75% { stroke-dashoffset: 1; } 7.00%, 95% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .f1 { animation: f1 20s infinite; }
    @keyframes f1 { 0%, 7.00% { opacity: 0; transform: translateY(-26px) rotate(-6deg); } 8.75% { opacity: 1; transform: translateY(3px) rotate(1deg); } 9.75%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
    .s1 { animation: s1 20s infinite; }
    @keyframes s1 { 0%, 8.75% { stroke-dashoffset: 1; } 12.00%, 95% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .f2 { animation: f2 20s infinite; }
    @keyframes f2 { 0%, 12.00% { opacity: 0; transform: translateY(-26px) rotate(-6deg); } 13.75% { opacity: 1; transform: translateY(3px) rotate(1deg); } 14.75%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
    .s2 { animation: s2 20s infinite; }
    @keyframes s2 { 0%, 13.75% { stroke-dashoffset: 1; } 17.00%, 95% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .f3 { animation: f3 20s infinite; }
    @keyframes f3 { 0%, 17.00% { opacity: 0; transform: translateY(-26px) rotate(-6deg); } 18.75% { opacity: 1; transform: translateY(3px) rotate(1deg); } 19.75%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
    .s3 { animation: s3 20s infinite; }
    @keyframes s3 { 0%, 18.75% { stroke-dashoffset: 1; } 22.00%, 95% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .f4 { animation: f4 20s infinite; }
    @keyframes f4 { 0%, 22.00% { opacity: 0; transform: translateY(-26px) rotate(-6deg); } 23.75% { opacity: 1; transform: translateY(3px) rotate(1deg); } 24.75%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
    .s4 { animation: s4 20s infinite; }
    @keyframes s4 { 0%, 23.75% { stroke-dashoffset: 1; } 27.00%, 95% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .f5 { animation: f5 20s infinite; }
    @keyframes f5 { 0%, 27.00% { opacity: 0; transform: translateY(-26px) rotate(-6deg); } 28.75% { opacity: 1; transform: translateY(3px) rotate(1deg); } 29.75%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
    .s5 { animation: s5 20s infinite; }
    @keyframes s5 { 0%, 28.75% { stroke-dashoffset: 1; } 32.00%, 95% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .f6 { animation: f6 20s infinite; }
    @keyframes f6 { 0%, 32.00% { opacity: 0; transform: translateY(-26px) rotate(-6deg); } 33.75% { opacity: 1; transform: translateY(3px) rotate(1deg); } 34.75%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
    .s6 { animation: s6 20s infinite; }
    @keyframes s6 { 0%, 33.75% { stroke-dashoffset: 1; } 37.00%, 95% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .f7 { animation: f7 20s infinite; }
    @keyframes f7 { 0%, 37.00% { opacity: 0; transform: translateY(-26px) rotate(-6deg); } 38.75% { opacity: 1; transform: translateY(3px) rotate(1deg); } 39.75%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }

    /* O "?" da próxima pista pisca como luz falhando */
    .interroga { animation: interroga 2.5s infinite; }
    @keyframes interroga { 0%, 100% { opacity: 1; } 46% { opacity: 1; } 48% { opacity: .2; } 50% { opacity: 1; } 53% { opacity: .3; } 55% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .fio { stroke-dashoffset: 0; }
    }
  </style>

  <!-- MURAL DE CORTIÇA com moldura -->
  <rect width="900" height="470" fill="#3a2414"/>
  <rect x="12" y="12" width="876" height="446" fill="#8a5d36" filter="url(#cortica)"/>
  <rect x="12" y="12" width="876" height="446" fill="url(#luz)"/>

  <!-- etiqueta do título -->
  <g filter="url(#sombra)">
    <rect x="300" y="26" width="300" height="38" fill="#efe7d4" transform="rotate(-1 450 45)"/>
  </g>
  <text x="450" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2418" letter-spacing="3" transform="rotate(-1 450 45)">CRONOLOGIA DO CASO</text>

  <!-- FICHAS -->
  <!-- ficha 1: AGO/2014 -->
  <g transform="translate(30,92) rotate(-2 95.0 66.0)">
    <g class="ficha f0">
      <rect width="190" height="132" fill="#efe7d4" filter="url(#sombra)"/>
      <line x1="12" y1="62" x2="178" y2="62" stroke="#c9a9a0" stroke-width="1"/>
      <text x="14" y="36" font-size="15" font-weight="700" fill="#b3261e" letter-spacing="1">AGO/2014</text>
      <text x="14" y="56" font-size="14.5" font-weight="700" fill="#2b2418">Riachuelo</text>
      <text x="14" y="86" font-size="11" fill="#5a4e3c">Assistente de Negócios II</text>
      <text x="14" y="104" font-size="11" fill="#5a4e3c">atendimento e crediário</text>
      <circle cx="95.0" cy="10" r="6" fill="#b3261e" stroke="#5e120d" stroke-width="1.5"/><circle cx="93.0" cy="8" r="1.8" fill="#ff8a7d"/>
    </g>
  </g>
  <!-- ficha 2: MAR/2020 -->
  <g transform="translate(250,92) rotate(1.5 95.0 66.0)">
    <g class="ficha f1">
      <rect width="190" height="132" fill="#efe7d4" filter="url(#sombra)"/>
      <line x1="12" y1="62" x2="178" y2="62" stroke="#c9a9a0" stroke-width="1"/>
      <text x="14" y="36" font-size="15" font-weight="700" fill="#b3261e" letter-spacing="1">MAR/2020</text>
      <text x="14" y="56" font-size="14.5" font-weight="700" fill="#2b2418">Ramos e Silva</text>
      <text x="14" y="86" font-size="11" fill="#5a4e3c">Promotora de Negócios</text>
      <text x="14" y="104" font-size="11" fill="#5a4e3c">negociação e fidelização</text>
      <circle cx="95.0" cy="10" r="6" fill="#b3261e" stroke="#5e120d" stroke-width="1.5"/><circle cx="93.0" cy="8" r="1.8" fill="#ff8a7d"/>
    </g>
  </g>
  <!-- ficha 3: ABR/2021 -->
  <g transform="translate(470,92) rotate(-1 95.0 66.0)">
    <g class="ficha f2">
      <rect width="190" height="132" fill="#efe7d4" filter="url(#sombra)"/>
      <line x1="12" y1="62" x2="178" y2="62" stroke="#c9a9a0" stroke-width="1"/>
      <text x="14" y="36" font-size="15" font-weight="700" fill="#b3261e" letter-spacing="1">ABR/2021</text>
      <text x="14" y="56" font-size="14.5" font-weight="700" fill="#2b2418">Best the Best</text>
      <text x="14" y="86" font-size="11" fill="#5a4e3c">superou a meta em 5x</text>
      <text x="14" y="104" font-size="11" fill="#5a4e3c">prêmio interno</text>
      <circle cx="95.0" cy="10" r="6" fill="#b3261e" stroke="#5e120d" stroke-width="1.5"/><circle cx="93.0" cy="8" r="1.8" fill="#ff8a7d"/>
    </g>
  </g>
  <!-- ficha 4: 2024 -->
  <g transform="translate(690,92) rotate(2 95.0 66.0)">
    <g class="ficha f3">
      <rect width="190" height="132" fill="#efe7d4" filter="url(#sombra)"/>
      <line x1="12" y1="62" x2="178" y2="62" stroke="#c9a9a0" stroke-width="1"/>
      <text x="14" y="36" font-size="15" font-weight="700" fill="#b3261e" letter-spacing="1">2024</text>
      <text x="14" y="56" font-size="14.5" font-weight="700" fill="#2b2418">A virada</text>
      <text x="14" y="86" font-size="11" fill="#5a4e3c">entra em Sistemas de</text>
      <text x="14" y="104" font-size="11" fill="#5a4e3c">Informação · Estácio</text>
      <circle cx="95.0" cy="10" r="6" fill="#b3261e" stroke="#5e120d" stroke-width="1.5"/><circle cx="93.0" cy="8" r="1.8" fill="#ff8a7d"/>
    </g>
  </g>
  <!-- ficha 5: JAN/2026 -->
  <g transform="translate(30,312) rotate(1.5 95.0 66.0)">
    <g class="ficha f4">
      <rect width="190" height="132" fill="#efe7d4" filter="url(#sombra)"/>
      <line x1="12" y1="62" x2="178" y2="62" stroke="#c9a9a0" stroke-width="1"/>
      <text x="14" y="36" font-size="15" font-weight="700" fill="#b3261e" letter-spacing="1">JAN/2026</text>
      <text x="14" y="56" font-size="14.5" font-weight="700" fill="#2b2418">Cursos na Alura</text>
      <text x="14" y="86" font-size="11" fill="#5a4e3c">lógica com JavaScript</text>
      <text x="14" y="104" font-size="11" fill="#5a4e3c">e PostgreSQL</text>
      <circle cx="95.0" cy="10" r="6" fill="#b3261e" stroke="#5e120d" stroke-width="1.5"/><circle cx="93.0" cy="8" r="1.8" fill="#ff8a7d"/>
    </g>
  </g>
  <!-- ficha 6: OUT/2026 -->
  <g transform="translate(250,312) rotate(-2 95.0 66.0)">
    <g class="ficha f5">
      <rect width="190" height="132" fill="#efe7d4" filter="url(#sombra)"/>
      <line x1="12" y1="62" x2="178" y2="62" stroke="#c9a9a0" stroke-width="1"/>
      <text x="14" y="36" font-size="15" font-weight="700" fill="#b3261e" letter-spacing="1">OUT/2026</text>
      <text x="14" y="56" font-size="14.5" font-weight="700" fill="#2b2418">Primeiros projetos</text>
      <text x="14" y="86" font-size="11" fill="#5a4e3c">calculadora, tarefas e</text>
      <text x="14" y="104" font-size="11" fill="#5a4e3c">conversor · iniciante</text>
      <circle cx="95.0" cy="10" r="6" fill="#b3261e" stroke="#5e120d" stroke-width="1.5"/><circle cx="93.0" cy="8" r="1.8" fill="#ff8a7d"/>
    </g>
  </g>
  <!-- ficha 7: EM CURSO -->
  <g transform="translate(470,312) rotate(1 95.0 66.0)">
    <g class="ficha f6">
      <rect width="190" height="132" fill="#efe7d4" filter="url(#sombra)"/>
      <line x1="12" y1="62" x2="178" y2="62" stroke="#c9a9a0" stroke-width="1"/>
      <rect x="4" y="4" width="182" height="124" fill="none" stroke="#8a7d68" stroke-width="1.2" stroke-dasharray="5 4"/>
      <text x="14" y="36" font-size="15" font-weight="700" fill="#b3261e" letter-spacing="1">EM CURSO</text>
      <text x="14" y="56" font-size="14.5" font-weight="700" fill="#2b2418">Página pessoal</text>
      <text x="14" y="86" font-size="11" fill="#5a4e3c">site para reunir</text>
      <text x="14" y="104" font-size="11" fill="#5a4e3c">meus projetos</text>
      <g transform="translate(118,112) rotate(-12)"><rect x="-58" y="-13" width="116" height="22" fill="none" stroke="#b3261e" stroke-width="2"/><text x="0" y="3" text-anchor="middle" font-size="11" font-weight="700" fill="#b3261e" letter-spacing="1">EM CONSTRUÇÃO</text></g>
      <circle cx="95.0" cy="10" r="6" fill="#b3261e" stroke="#5e120d" stroke-width="1.5"/><circle cx="93.0" cy="8" r="1.8" fill="#ff8a7d"/>
    </g>
  </g>
  <!-- ficha 8: PRÓXIMA PISTA -->
  <g transform="translate(690,312) rotate(-1.5 95.0 66.0)">
    <g class="ficha f7">
      <rect width="190" height="132" fill="#1c1d20" filter="url(#sombra)"/>
      <text x="14" y="36" font-size="15" font-weight="700" fill="#b3261e" letter-spacing="1">PRÓXIMA PISTA</text>
      <text class="interroga" x="168" y="76" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="46" fill="#b3261e">?</text>
      <text x="14" y="88" font-size="12" fill="#d8d2c4">estágio ou analista</text>
      <text x="14" y="104" font-size="12" fill="#d8d2c4">de suporte</text>
      <text x="14" y="122" font-size="11" fill="#8f897d">formatura: jan/2029</text>
      <circle cx="95.0" cy="10" r="6" fill="#b3261e" stroke="#5e120d" stroke-width="1.5"/><circle cx="93.0" cy="8" r="1.8" fill="#ff8a7d"/>
    </g>
  </g>

  <!-- FIO VERMELHO (por cima, ligando os alfinetes) -->
    <path class="fio s0" pathLength="1" d="M125,102 Q235,128 345,102"/>
    <path class="fio s1" pathLength="1" d="M345,102 Q455,128 565,102"/>
    <path class="fio s2" pathLength="1" d="M565,102 Q675,128 785,102"/>
    <path class="fio s3" pathLength="1" d="M785,102 C825,292 85,242 125,322"/>
    <path class="fio s4" pathLength="1" d="M125,322 Q235,348 345,322"/>
    <path class="fio s5" pathLength="1" d="M345,322 Q455,348 565,322"/>
    <path class="fio s6" pathLength="1" d="M565,322 Q675,348 785,322"/>
</svg>
