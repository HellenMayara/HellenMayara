# ARQUIVO H.M. — Perícia automática
# Atualiza o relatório da perícia e o "rastro" (a cobrinha) a cada 12 horas.
# Os arquivos gerados vão para a branch "output", sem bagunçar a branch main.

name: Perícia automática

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pericia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar o relatório da perícia
        run: python3 scripts/pericia.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Gerar o rastro (cobrinha comendo as contribuições)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/rastro.svg?color_snake=#b3261e&color_dots=#2b2e33,#5a2a27,#7f2c25,#a82b22,#d0443a

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
